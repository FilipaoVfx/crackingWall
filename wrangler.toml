name = "crackingwall"
compatibility_date = "2024-09-23"
# expose_global_message_channel: React 19 SSR (react-dom/server) references
# MessageChannel, which Workers only expose by default from compat date
# 2025-08-15+. This flag enables it without changing other runtime defaults.
compatibility_flags = ["nodejs_compat", "expose_global_message_channel"]
main = "./dist/_worker.js"

[assets]
directory = "./dist"
# The Astro Cloudflare adapter's worker serves static fallbacks (e.g. 404.html)
# via env.ASSETS. Without this binding env.ASSETS is undefined, so worker-handled
# not-found routes throw → generic 500 instead of the 404 page.
binding = "ASSETS"

[build]
command = "npm ci && npm run build"
watch_dir = "src"

[vars]
# ⚠️ DO NOT put secrets here — they are exposed in git history.
# Set these in Cloudflare Dashboard > Pages > Settings > Environment Variables:
#   - OPENROUTER_API_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
# Only non-secret vars below:
PUBLIC_SUPABASE_URL = "https://cauitdpbsedajkuodsaf.supabase.co"

# Workers Observability — keeps the dashboard toggle in sync so deploys don't
# reset it. Top-level `enabled = true` is the master switch (persists logs).
# head_sampling_rate = 1 → log 100% of requests.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = false
head_sampling_rate = 1
