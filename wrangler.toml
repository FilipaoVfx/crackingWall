name = "crackingwalldev2"
compatibility_date = "2024-09-23"
# expose_global_message_channel: React 19 SSR (react-dom/server) references
# MessageChannel, which Workers only expose by default from compat date
# 2025-08-15+. This flag enables it without changing other runtime defaults.
compatibility_flags = ["nodejs_compat", "expose_global_message_channel"]
main = "./dist/_worker.js"

[assets]
directory = "./dist"

[build]
command = "npm ci && npm run build"
watch_dir = "src"

[vars]
# ⚠️ DO NOT put secrets here — they are exposed in git history.
# Set these in Cloudflare Dashboard > Pages > Settings > Environment Variables:
#   - OPENROUTER_API_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
# Only non-secret vars below:
PUBLIC_SUPABASE_URL = "https://cauitdpbsedajkuodsaf.supabase.co"
