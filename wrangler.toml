name = "crackingwall"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js"

[assets]
directory = "./dist"

[build]
command = "npm ci && npm run build"
watch_dir = "src"

[vars]
OPENROUTER_API_KEY = ""
PUBLIC_SUPABASE_URL = ""
SUPABASE_SERVICE_ROLE_KEY = ""
